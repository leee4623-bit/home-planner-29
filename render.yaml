# Render 배포 설정 — GitHub 저장소를 Render "Blueprint"로 연결하면 이 설정대로 웹 서비스가 만들어집니다.
# 고객 데이터는 Render 디스크가 아니라 외부 Postgres(예: Neon 무료)에 저장합니다(DATABASE_URL).
# 비밀 값(DATABASE_URL, FSS_API_KEY, FP_DEMO_PASSWORD)은 이 파일에 쓰지 않고 Render 화면에서 입력합니다(sync: false).
services:
  - type: web
    name: home-planner-29
    runtime: node
    plan: free            # 무료: 15분간 접속이 없으면 잠들고, 첫 접속 때 30초~1분 깨어나는 시간이 걸림(데이터는 Postgres에 남음)
    buildCommand: echo "빌드 필요 없음(외부 패키지 없음)"
    startCommand: node --no-warnings server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false       # Neon 등에서 복사한 연결 문자열(postgres://...?sslmode=require)
      - key: SESSION_SECRET
        generateValue: true   # 세션 비밀키(Render가 무작위 생성). 바꾸면 모든 사용자가 다시 로그인
      - key: FP_ADMIN_TOKEN
        generateValue: true   # 관리자 API 토큰(Render가 무작위로 생성, 화면에서 확인)
      - key: FP_DEMO
        value: "1"        # 1=시연 모드(빈 DB에 가상 계정 생성·로그인 화면 시연 버튼), 실제 운영은 0
      - key: FP_DEMO_PASSWORD
        sync: false       # 시연 계정 비밀번호(공개 주소에서는 1234 같은 쉬운 값 쓰지 않기)
      - key: FSS_API_KEY
        sync: false       # 금융감독원 「금융상품 한눈에」 오픈API 인증키(없으면 공시 상품은 표시하지 않음)
